[tool.poetry]
name = "wkr"
version = "0.1.0"
description = "VKR repository for workload optimization with ML (LSTM + clustering)."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "wkr", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.0"
pyarrow = "^15.0.0"
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
isort = "^5.13.0"
ruff = "^0.2.0"
mypy = "^1.8.0"
pytest = "^8.0.0"
pre-commit = "^3.6.0"
types-PyYAML = "^6.0.12.20240311"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
